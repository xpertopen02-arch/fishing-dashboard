<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낚시 브리핑</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#1f2631">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="rail" aria-label="화면">
  <button class="rail-logo" data-welcome aria-label="환영 화면 보고 홈으로"><i data-icon="fish" aria-hidden="true"></i></button>
  <nav class="tabs">
    <button data-go="home"><i data-icon="home" aria-hidden="true"></i><span>홈</span></button>
    <button data-go="plan"><i data-icon="bolt" aria-hidden="true"></i><span>지금</span></button>
    <button data-go="map"><i data-icon="map" aria-hidden="true"></i><span>지도</span></button>
    <button data-go="log"><i data-icon="book" aria-hidden="true"></i><span>기록</span></button>
    <button data-go="library"><i data-icon="library" aria-hidden="true"></i><span>자료</span></button>
    <button data-go="notes" hidden><i data-icon="compass" aria-hidden="true"></i><span>연구</span></button>
    <span class="tab-ink" hidden></span>
  </nav>
  <div class="rail-foot">
    <button class="icon-btn" id="rotateBtn" type="button" aria-label="화면 가로·세로 전환" title="화면 가로·세로 전환"><i data-icon="rotate" aria-hidden="true"></i></button>
    <button class="icon-btn" id="phoneBtn" aria-label="휴대폰 화면으로 보기" title="휴대폰 화면으로 보기"><i data-icon="phone" aria-hidden="true"></i></button>
    <button class="icon-btn" id="themeBtn" aria-label="밝기 전환" title="밝기 전환"><i data-icon="contrast" aria-hidden="true"></i></button>
    <button class="ver-btn" id="verBtn" title="변경 기록 보기"></button>
  </div>
</aside>

<header class="top">
  <details class="place-pick" id="placePick">
    <summary><i data-icon="pin" aria-hidden="true"></i><span class="pp-text"><b id="placeName">낚시터</b><small id="placeType"></small></span><i data-icon="chev" class="chev" aria-hidden="true"></i></summary>
    <div class="place-box" id="placeChips"></div>
  </details>
  <div class="top-go" id="topGo"></div>
  <div class="top-title">출조 판단</div>
  <button class="search-open" id="searchOpen" aria-label="자료 검색"><i data-icon="search" aria-hidden="true"></i><span>낚시터, 기법, 조행기 검색</span><kbd>/</kbd></button>
  <div class="type-toggle" id="typeToggle" role="group" aria-label="낚시 종류"></div>
  <div class="top-date">
    <label for="dateInput" class="sr">낚시 날짜</label>
    <input type="date" id="dateInput">
    <button class="dnav" id="dNext" type="button" aria-label="다음 날" title="다음 날 (오늘이면 내일)"><i data-icon="chevR" aria-hidden="true"></i></button>
    <button class="dnav" id="dWeekend" type="button" aria-label="표시된 날짜 이후 토요일, 한 번 더 누르면 일요일" title="표시된 날짜 이후 토요일 (한 번 더 누르면 일요일)"><i data-icon="chevR2" aria-hidden="true"></i></button>
    <div class="quick" id="quickDates" hidden></div>
    <small class="date-range" id="dateRange" hidden></small>
  </div>
  <button class="top-wx" id="wxBtn" type="button">날씨</button>
  <div class="top-clock" id="topClock"></div>
</header>

<main>
  <section id="view-home" class="view" hidden></section>
  <section id="view-plan" class="view">
    <div class="cc">
      <div class="cc-left" id="ccLeft"></div>
      <div class="cc-mid">
        <div id="ccMid"></div>
        <div class="days" id="dayStrip" aria-label="앞으로 16일"></div>
      </div>
      <div class="cc-right" id="ccRight"></div>
    </div>
    <section class="sec" id="analysisSec">
      <h2 class="eyebrow">세부 그래프</h2>
      <div class="charts" id="charts"></div>
      <div class="records" id="records"></div>
    </section>
    <section class="sec" id="docsSec">
      <h2 class="eyebrow">공략 자료</h2>
      <div class="dossier" id="dossier"></div>
    </section>
  </section>

  <section id="view-map" class="view" hidden>
    <div class="mapview">
      <div class="map-card">
        <div id="map"></div>
        <canvas id="windCanvas" aria-hidden="true"></canvas>
        <div class="map-note" id="mapNote" hidden></div>
        <div class="map-tools">
          <button id="mapSat" aria-pressed="false">위성 보기</button>
          <button id="mapAll">전체 낚시터 보기</button>
        </div>
        <div class="hour-bar">
          <button class="play" id="playBtn" aria-label="시간 재생"></button>
          <input type="range" id="hourRange" min="0" max="23" value="6" aria-label="시간">
          <output id="hourLabel">06:00</output>
        </div>
      </div>
      <aside class="map-panel" id="mapPanel"></aside>
      <button class="mp-open" id="mpOpen" data-panel-toggle hidden aria-label="낚시터 정보 펼치기">낚시터 정보 <i data-icon="chevR" aria-hidden="true"></i></button>
    </div>
  </section>

  <section id="view-log" class="view" hidden></section>
  <section id="view-library" class="view" hidden></section>
  <section id="view-notes" class="view" hidden></section>
</main>

<button class="to-top" id="toTop" aria-label="맨 위로" title="맨 위로"><i data-icon="up" aria-hidden="true"></i></button>

<div class="drawer-back" id="drawerBack" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="자료 보기"></aside>

<div class="search-layer" id="searchLayer" hidden>
  <div class="search-panel" role="dialog" aria-label="자료 검색">
    <div class="search-head">
      <input id="searchInput" type="search" placeholder="어종, 떡밥, 기법, 낚시터 이름으로 검색" autocomplete="off">
      <button class="icon-btn" id="searchClose" aria-label="닫기"><i data-icon="x" aria-hidden="true"></i></button>
    </div>
    <div class="search-filter" id="searchFilter"></div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/meta.js"></script>
<script src="versions.js"></script>
<script src="img/places/photos.js"></script>
<script src="app.js"></script>
</body>
</html>
